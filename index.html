<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <div class="container">
            <div class="image-container">
                <img src="assets/images/halie-west-25xggax4bSA-unsplash.jpg" alt="green leafy background"
                    class="background">
                <div class="heading-bg">
                    <img src="assets/images/odin-lined.png" alt="odin logo" class="logo">
                    <h1>Odin</h1>

                </div>
                <p class="credit">Photo by <span class="underline">Halie West</span> on <span
                        class="underline">Unsplash</span></p>
            </div>
            <div class="info-container">
                <div class="heading">
                    <p class="heading-text">This is not a real online service! You know you need something like this in
                        your life to help you
                        realize your deepest dreams.<br>Sign up <span class="cursive">now</span> to get started.</p>
                    <p>You <span class="cursive">know</span> you want to.</p>
                </div>
                <div class="sign-up">
                    <h2>Let's do this!</h2>
                    <form>
                        <label for="firstname">First name:</label>
                        <input type="text" name="firstname" id="firstname" class="blue">
                        <label for="lastname">Last name:</label>
                        <input type="text" name="lastname" id="lastname" class="blue">
                        <label for="email">Email:</label>
                        <input type="text" name="email" id="email" class="blue">
                        <label for="phone">Phone number:</label>
                        <input type="number" name="phone" id="phone" class="blue">
                        <label for="password">Password:</label>
                        <input type="text" name="password" id="password" class="red">
                        <label for="c-password">Confirm password:</label>
                        <input type="text" name="c-password" id="c-password" class="red">
                    </form>

                </div>
                <div class="footer">
                    <button>Create Account</button>
                    <p class="account">Already have an account? <span class="link">Log in</span></p>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
